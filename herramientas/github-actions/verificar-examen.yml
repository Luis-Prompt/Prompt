name: Verificar generador de examen

on:
  push:
    paths: ['prompts/**', 'INDICE-PARA-CLAUDE.md', 'README.md']
  pull_request:
    paths: ['prompts/**', 'INDICE-PARA-CLAUDE.md', 'README.md']

jobs:
  generar-ejemplo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prompts/evaluacion/creacion-pruebas-saber
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar LibreOffice y poppler
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils
      - name: Instalar dependencias
        run: npm install
      - name: Generar el examen de ejemplo
        run: npm run ejemplo
      - name: Probar los 20 ejemplos de áreas
        run: npm run probar:areas
      - name: Probar el recorte de ilustraciones
        run: npm run ejemplo:imagenes
      - name: Comprobar que salieron los dos Word y el resumen
        run: |
          ls salida
          test -f salida/*_ESTUDIANTE.docx
          test -f salida/*_DOCENTE_CLAVES.docx
          test -f salida/resumen.json
      - name: Guardar los Word generados
        uses: actions/upload-artifact@v4
        with:
          name: examen-ejemplo
          path: prompts/evaluacion/creacion-pruebas-saber/salida/*.docx

  generar-planeacion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prompts/planeacion/planeaciones-de-clase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar LibreOffice y poppler
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils
      - run: npm install
      - name: Generar la planeación de ejemplo (Word y PDF)
        run: npm run ejemplo
      - name: Comprobar que salieron el Word y el PDF
        run: |
          ls salida
          test -f salida/*.docx
          test -f salida/*.pdf

  verificar-aislamiento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Comprobar que los prompts no se mezclan
        run: node herramientas/verificar-indice.js
