name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo lectura: el CI no necesita escribir en el repositorio
permissions:
  contents: read

# Si llega un commit nuevo, cancela la ejecución anterior de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad y aislamiento de los prompts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JSON válidos, enlaces, rutas, secretos y tamaños
        run: node herramientas/verificar-calidad.js
      - name: Comprobar que los prompts no se mezclan
        run: node herramientas/verificar-indice.js
      - name: Probar el puente de datos plan → borrador de preguntas
        run: node herramientas/plan-a-borrador.js prompts/planeacion/planeaciones-de-clase/examples/plan_ejemplo.json --out /tmp/preguntas_planeacion.json

  pruebas-saber:
    name: Generador de pruebas tipo SABER
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prompts/evaluacion/creacion-pruebas-saber
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prompts/evaluacion/creacion-pruebas-saber/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar LibreOffice y poppler
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils
      - name: Instalar dependencias
        run: npm ci
      - name: Generar el examen de ejemplo
        run: npm run ejemplo
      - name: Probar los 20 ejemplos de áreas
        run: npm run probar:areas
      - name: Probar el recorte de ilustraciones
        run: npm run ejemplo:imagenes
      - name: Probar la plantilla de calificación en Excel
        run: |
          pip install openpyxl
          npm run probar:calificacion
      - name: Comprobar que salieron los dos Word y el resumen
        run: |
          ls salida
          test -f salida/*_ESTUDIANTE.docx
          test -f salida/*_DOCENTE_CLAVES.docx
          test -f salida/resumen.json
      - name: Guardar los Word generados
        uses: actions/upload-artifact@v4
        with:
          name: examen-ejemplo
          path: prompts/evaluacion/creacion-pruebas-saber/salida/*.docx
          retention-days: 14

  planeaciones:
    name: Generador de planeaciones de clase
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prompts/planeacion/planeaciones-de-clase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prompts/planeacion/planeaciones-de-clase/package-lock.json
      - name: Instalar LibreOffice y poppler
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils
      - run: npm ci
      - name: Generar la planeación de ejemplo (Word y PDF)
        run: npm run ejemplo
      - name: Comprobar que salieron el Word y el PDF
        run: |
          ls salida
          test -f salida/*.docx
          test -f salida/*.pdf
      - name: Guardar la planeación generada
        uses: actions/upload-artifact@v4
        with:
          name: planeacion-ejemplo
          path: |
            prompts/planeacion/planeaciones-de-clase/salida/*.docx
            prompts/planeacion/planeaciones-de-clase/salida/*.pdf
          retention-days: 14
